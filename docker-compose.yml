services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tabletop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tabletop}
      POSTGRES_DB: tabletop
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tabletop"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
